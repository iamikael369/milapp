    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        :root {
            --temple-gold: #fbbf24;
            --temple-dark: #05070a;
            --mystic-violet: #8b5cf6;
            --mystic-amber: #f59e0b;
        }

        body {
            background-color: var(--temple-dark);
            color: #e2e8f0;
            font-family: 'EB Garamond', serif;
            overflow-x: hidden;
            overflow-y: auto !important;
            min-height: 100vh;
            height: auto !important;
            transition: background 0.8s ease;
        }

        /* Ambient */
        .stars-container {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            overflow: hidden;
        }
        .star {
            position: absolute; background: white; border-radius: 50%;
            opacity: 0.5; animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }

        /* Cursor Aura */
        #cursor-aura {
            position: fixed; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: 1;
            transform: translate(-50%, -50%); transition: opacity 0.3s;
        }

        /* Glass Panels */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        /* Image Cards */
        .dream-card {
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dream-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--temple-gold);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .dream-card img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.8s ease;
        }
        .dream-card:hover img { transform: scale(1.1); }
        .dream-card .overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent 60%);
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 20px; opacity: 0; transition: opacity 0.3s;
        }
        .dream-card:hover .overlay { opacity: 1; }

        /* Hypnosis Mode */
        #hypnosis-overlay {
            position: fixed; inset: 0; z-index: 1000;
            background: #000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        #hypnosis-overlay.active { display: flex; animation: fadeInHypno 2s forwards; }
        @keyframes fadeInHypno { from { opacity: 0; } to { opacity: 1; } }

        .hypnos-image {
            width: 100%; height: 100%; object-fit: cover;
            filter: brightness(0.7) contrast(1.1);
            animation: kenBurns 20s infinite alternate;
        }
        @keyframes kenBurns {
            0% { transform: scale(1) translate(0,0); }
            100% { transform: scale(1.2) translate(-2%, -2%); }
        }

        .affirmation-text {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; text-align: center;
            font-family: 'Cinzel', serif;
            color: white;
            text-shadow: 0 0 20px rgba(255,255,255,0.8);
            opacity: 0;
            pointer-events: none;
            z-index: 1010;
        }
        .affirmation-active { animation: affirmationCycle 6s infinite; }
        @keyframes affirmationCycle {
            0%, 100% { opacity: 0; transform: translate(-50%, -40%) scale(0.9); filter: blur(10px); }
            20%, 80% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
        }

        .binaural-status {
            position: absolute; bottom: 40px;
            font-family: 'EB Garamond', serif; font-style: italic;
            color: rgba(255,255,255,0.4); letter-spacing: 0.2em;
            animation: pulseText 4s infinite;
        }
        @keyframes pulseText { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }

        /* Floating Menu */
        .floating-menu {
            position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: 20px;
            display: flex; flex-direction: column; gap: 12px; z-index: 100;
        }

        .action-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; justify-content: center;
            color: white; transition: all 0.3s;
            cursor: pointer;
        }
        .action-btn:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.1); border-color: var(--temple-gold); }

        /* Alchemical Seal Button */
        .seal-btn {
            width: 80px; height: 80px; border-radius: 50%;
            background: #000; border: 1px solid var(--temple-gold);
            display: flex; align-items: center; justify-content: center; font-size: 32px;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
            transition: all 0.5s; cursor: pointer;
        }
        .seal-btn:hover { transform: rotate(180deg) scale(1.1); box-shadow: 0 0 40px rgba(251, 191, 36, 0.4); }

        /* Alch Chips */
        .alch-chip.active, .style-chip.active {
            background: var(--temple-gold);
            color: black;
            border-color: var(--temple-gold);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
        }

    </style>
</head>

    <script src="assets/js/universo.js"></script>
    <script>
        let dreamMap = JSON.parse(localStorage.getItem('mila_dream_map')) || [];
        let activeProfile = Universo.getActiveProfile();
        let currentVisibility = 'private';
        let currentAlchChar = 'Mila';
        let currentAlchStyle = 'Místico';
        let hypnoTimer = null;
        let currentHypnoIdx = 0;

        function setAlchParam(type, val) {
            if (type === 'char') {
                currentAlchChar = val;
                document.querySelectorAll('.alch-chip').forEach(c => {
                    c.classList.toggle('active', c.innerText === val);
                });
                document.getElementById('alch-char-other').classList.toggle('hidden', val !== 'Otro');
            } else {
                currentAlchStyle = val;
                document.querySelectorAll('.style-chip').forEach(c => {
                    c.classList.toggle('active', c.innerText === val);
                });
                document.getElementById('alch-style-other').classList.toggle('hidden', val !== 'Otro');
            }
        }

        function setVisibility(v) {
            currentVisibility = v;
            const btnPrivate = document.getElementById('vis-private');
            const btnShared = document.getElementById('vis-shared');
            if (v === 'private') {
                btnPrivate.className = "flex items-center gap-2 px-6 py-2 rounded-full text-[10px] font-cinzel tracking-[0.2em] transition-all bg-mystic-violet text-white";
                btnShared.className = "flex items-center gap-2 px-6 py-2 rounded-full text-[10px] font-cinzel tracking-[0.2em] transition-all text-white/40 hover:text-white";
            } else {
                btnShared.className = "flex items-center gap-2 px-6 py-2 rounded-full text-[10px] font-cinzel tracking-[0.2em] transition-all bg-mystic-amber text-white";
                btnPrivate.className = "flex items-center gap-2 px-6 py-2 rounded-full text-[10px] font-cinzel tracking-[0.2em] transition-all text-white/40 hover:text-white";
            }
        }

        const AFFIRMATIONS = [
            "Eres el creador de tu realidad",
            "Todo lo que buscas te está buscando",
            "Eres abundancia infinita",
            "Tu voluntad es el decreto del universo",
            "Siente la emoción del logro ahora",
            "Mereces todo lo que sueñas",
            "MILA & MIGUELO: Un solo destino de luz",
            "El tiempo se colapsa a tu favor",
            "Ríndete a la magia del proceso"
        ];

        // --- INIT ---
        function init() {
            initStars();
            initCursorAura();
            updateProfileUI();
            renderGallery();
        }

        function initStars() {
            const container = document.getElementById('starsLayer');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const size = Math.random() * 2 + 0.5;
                const duration = (Math.random() * 4 + 2) + 's';
                star.style.left = `${x}%`;
                star.style.top = `${y}%`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.setProperty('--duration', duration);
                container.appendChild(star);
            }
        }

        function initCursorAura() {
            const aura = document.getElementById('cursor-aura');
            document.addEventListener('mousemove', (e) => {
                if (aura) {
                    aura.style.left = e.clientX + 'px';
                    aura.style.top = e.clientY + 'px';
                }
            });
        }

        function updateProfileUI() {
            activeProfile = Universo.getActiveProfile();
            document.getElementById('active-user-name').innerText = activeProfile.name.toUpperCase();
            
            const greetingEl = document.getElementById('dream-header-greeting');
            if (greetingEl) {
                if (activeProfile.id === 'mila_admin') {
                    greetingEl.innerText = "Bienvenida, Mila • Tu visión guía el templo";
                } else if (activeProfile.id === 'miguelo_admin') {
                    greetingEl.innerText = "Guardián Miguelo • Construyendo realidades";
                }
            }

            const avatar = document.getElementById('user-avatar');
            if (avatar) {
                avatar.innerText = activeProfile.name.charAt(0);
                avatar.style.backgroundColor = activeProfile.color || '#4c1d95';
            }
        }

        // --- GALLERY ---
        function renderGallery() {
            const grid = document.getElementById('dreams-grid');
            const empty = document.getElementById('empty-gallery');
            const count = document.getElementById('gallery-count');
            
            grid.innerHTML = '';
            
            // FILTRADO DE PRIVACIDAD SAGRADA
            let filteredDreams = Universo.filterPrivateData(dreamMap);
            
            count.innerText = `${filteredDreams.length} IMÁGENES`;

            if (filteredDreams.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            filteredDreams.forEach((dream, idx) => {
                const card = document.createElement('div');
                card.className = "dream-card aspect-square relative";
                card.innerHTML = `
                    <img src="${dream.url}" alt="Sueño">
                    <!-- Privacy Badge -->
                    <div class="absolute top-4 right-4 z-10">
                        ${dream.visibility === 'shared' ? 
                            '<span class="material-symbols-outlined text-xs text-mystic-gold bg-black/40 p-2 rounded-full backdrop-blur-md">group</span>' : 
                            '<span class="material-symbols-outlined text-xs text-white/40 bg-black/40 p-2 rounded-full backdrop-blur-md">lock</span>'}
                    </div>
                    <div class="overlay">
                        <h4 class="font-cinzel text-lg text-white">${dream.title}</h4>
                        <div class="flex justify-between items-center">
                            <p class="text-[10px] text-white/60 font-cinzel uppercase tracking-widest">${dream.owner_name || dream.owner} • ${dream.date}</p>
                            <button onclick="deleteDream(event, ${idx})" class="text-white/20 hover:text-red-400 transition-colors">
                                <span class="material-symbols-outlined text-sm">delete</span>
                            </button>
                        </div>
                    </div>
                `;
                card.onclick = () => openImageFullscreen(dream.url);
                grid.appendChild(card);
            });
        }

        function uploadImage(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const newDream = {
                    url: e.target.result,
                    title: "Recuerdo Invocado",
                    owner: activeProfile.id,
                    owner_name: activeProfile.name,
                    visibility: currentVisibility,
                    date: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })
                };
                dreamMap.unshift(newDream);
                localStorage.setItem('mila_dream_map', JSON.stringify(dreamMap));
                setVisibility('private'); // Reset
                renderGallery();
            };
            reader.readAsDataURL(file);
        }

        async function invokeDream() {
            const promptInput = document.getElementById('dream-prompt');
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            const btn = document.getElementById('invoke-btn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-sm">refresh</span> ALINEANDO...`;
            btn.disabled = true;

            // Refrescar perfil activo para tener datos actualizados (fotos, etc)
            activeProfile = Universo.getActiveProfile();
            const profiles = Universo.getProfiles();

            // Alquimia Avanzada
            let finalChar = currentAlchChar === 'Otro' ? document.getElementById('alch-char-other').value : currentAlchChar;
            let finalStyle = currentAlchStyle === 'Otro' ? document.getElementById('alch-style-other').value : currentAlchStyle;
            
            // Construcción del Prompt Sagrado con Referencias Visuales Dinámicas
            let fullPrompt = `Vision Quest: ${prompt}. `;
            
            // Lógica de Referencias según Personaje
            if (finalChar === 'Mila') {
                const mila = profiles.find(p => p.id === 'mila_admin') || activeProfile;
                fullPrompt += `Personaje: Mila (Referencia Facial: ${mila.aiReferenceUrl || mila.photoUrl || 'assets/images/Mila.png'}). `;
            } else if (finalChar === 'Miguelo') {
                const miguelo = profiles.find(p => p.id === 'miguelo_admin') || activeProfile;
                fullPrompt += `Personaje: Miguelo (Referencia Facial: ${miguelo.aiReferenceUrl || miguelo.photoUrl || 'assets/images/Miguelo.png'}). `;
            } else if (finalChar === 'Ambos') {
                const mila = profiles.find(p => p.id === 'mila_admin') || activeProfile;
                const miguelo = profiles.find(p => p.id === 'miguelo_admin') || activeProfile;
                fullPrompt += `Personajes: Mila (Ref: ${mila.aiReferenceUrl || mila.photoUrl}) y Miguelo (Ref: ${miguelo.aiReferenceUrl || miguelo.photoUrl}). `;
            } else if (finalChar) {
                // Si es un personaje personalizado, intentamos ver si el nombre coincide con el perfil activo
                if (finalChar.toLowerCase() === activeProfile.name.toLowerCase()) {
                    fullPrompt += `Personaje: ${finalChar} (Referencia Facial: ${activeProfile.aiReferenceUrl || activeProfile.photoUrl}). `;
                } else {
                    fullPrompt += `Personaje: ${finalChar}. `;
                }
            }
            
            fullPrompt += `Estilo de vestimenta: ${finalStyle}. Estética cinematográfica, ultra definida, 8k, luz mística.`;

            try {
                // Simulación de generación
                console.log("Invocando con prompt:", fullPrompt);
                await new Promise(r => setTimeout(r, 4000));
                
                const newDream = {
                    url: `https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=800&auto=format&fit=crop`, // Placeholder místico
                    title: prompt.substring(0, 20) + "...",
                    owner: activeProfile.id,
                    owner_name: activeProfile.name,
                    visibility: currentVisibility,
                    alchParams: { char: finalChar, style: finalStyle },
                    date: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })
                };
                
                dreamMap.unshift(newDream);
                localStorage.setItem('mila_dream_map', JSON.stringify(dreamMap));
                promptInput.value = '';
                setVisibility('private'); // Reset
                renderGallery();
                
            } catch (err) {
                console.error(err);
            } finally {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        }

        function deleteDream(e, idx) {
            e.stopPropagation();
            if (confirm("¿Disolver esta visión del mapa?")) {
                dreamMap.splice(idx, 1);
                localStorage.setItem('mila_dream_map', JSON.stringify(dreamMap));
                renderGallery();
            }
        }

        // --- HYPNOSIS MODE ---
        function startHypnosis() {
            if (dreamMap.length === 0) {
                alert("Primero debes invocar o subir al menos una imagen a tu Mapa de Sueños.");
                return;
            }
            
            const overlay = document.getElementById('hypnosis-overlay');
            const audio = document.getElementById('binaural-audio');
            
            overlay.classList.add('active');
            audio.play();
            
            currentHypnoIdx = 0;
            cycleHypnosis();
        }

        function cycleHypnosis() {
            const imgEl = document.getElementById('hypno-image-display');
            const textEl = document.getElementById('affirmation-display');

            // Change Image
            imgEl.src = dreamMap[currentHypnoIdx].url;
            
            // Change Text
            textEl.innerText = AFFIRMATIONS[Math.floor(Math.random() * AFFIRMATIONS.length)];
            textEl.classList.remove('affirmation-active');
            void textEl.offsetWidth; // Trigger reflow
            textEl.classList.add('affirmation-active');

            currentHypnoIdx = (currentHypnoIdx + 1) % dreamMap.length;

            hypnoTimer = setTimeout(cycleHypnosis, 6000);
        }

        function stopHypnosis() {
            const overlay = document.getElementById('hypnosis-overlay');
            const audio = document.getElementById('binaural-audio');
            
            overlay.classList.remove('active');
            audio.pause();
            audio.currentTime = 0;
            clearTimeout(hypnoTimer);
        }

        function openImageFullscreen(url) {
            // Podríamos implementar un visor simple aquí también
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        window.onload = init;
    </script>
</body>
</html>
